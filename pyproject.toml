[project]
name = "soloos"
version = "0.1.0"
description = "AI-Native Operating System for Solopreneur CEOs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Phillip Hong"}]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "simpleeval>=0.9.13",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
telegram = ["python-telegram-bot>=21.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
soloos = "soloos.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
